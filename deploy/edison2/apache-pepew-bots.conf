# Include inside the existing HTTPS VirtualHost for pepepow.net.
# Only these exact application paths are proxied; ports 8790/8791 remain localhost-only.
ProxyPreserveHost On

ProxyPass        /pepew-telegram/webhooks/pepew http://127.0.0.1:8790/pepew-telegram/webhooks/pepew connectiontimeout=3 timeout=15 retry=0
ProxyPassReverse /pepew-telegram/webhooks/pepew http://127.0.0.1:8790/pepew-telegram/webhooks/pepew

ProxyPass        /pepew-discord/interactions http://127.0.0.1:8791/pepew-discord/interactions connectiontimeout=3 timeout=15 retry=0
ProxyPassReverse /pepew-discord/interactions http://127.0.0.1:8791/pepew-discord/interactions

ProxyPass        /pepew-discord/webhooks/pepew http://127.0.0.1:8791/pepew-discord/webhooks/pepew connectiontimeout=3 timeout=15 retry=0
ProxyPassReverse /pepew-discord/webhooks/pepew http://127.0.0.1:8791/pepew-discord/webhooks/pepew
