name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pepew-js dependencies
        run: npm install
        working-directory: packages/pepew-js

      - name: Test pepew-js
        run: npm test
        working-directory: packages/pepew-js

      - name: Install merchant SDK dependencies
        run: npm install
        working-directory: packages/pepewpay-merchant

      - name: Test merchant SDK
        run: npm test
        working-directory: packages/pepewpay-merchant

      - name: Check merchant reference examples
        run: node --check examples/merchant-node/reference-flow.mjs

      - name: Install PepewPay dependencies
        run: npm install
        working-directory: apps/pepewpay

      - name: Test PepewPay
        run: npm test
        working-directory: apps/pepewpay

      - name: Build PepewPay static output
        run: npm run build
        working-directory: apps/pepewpay

      - name: Check browser bundle for Node-only Buffer shims
        run: |
          set -euo pipefail
          if grep -R -n -E 'safe-buffer|process\.nextTick' dist/assets/*.js; then
            echo "PepewPay browser bundle contains Node-only compatibility code."
            exit 1
          fi
        working-directory: apps/pepewpay

      - name: Upload PepewPay static artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pepewpay-dist
          path: apps/pepewpay/dist
          if-no-files-found: error
          retention-days: 7

  merchant-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build local merchant SDK
        run: |
          npm install
          npm run build
        working-directory: packages/pepewpay-merchant

      - name: Install runnable merchant sample
        run: npm install
        working-directory: examples/merchant-app

      - name: Test runnable merchant sample
        run: npm run check
        working-directory: examples/merchant-app

      - name: Check framework webhook patterns
        run: |
          node --check examples/webhooks/express.mjs
          node --check examples/webhooks/fastify.mjs

  woocommerce-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Lint WooCommerce adapter PHP
        run: find integrations/woocommerce/pepew-payments -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test WooCommerce adapter units
        run: |
          php integrations/woocommerce/tests/identity-test.php
          php integrations/woocommerce/tests/webhook-verifier-test.php
          php integrations/woocommerce/tests/order-state-test.php

      - name: Guard HPOS-safe order persistence
        run: |
          set -euo pipefail
          if grep -R -n -E 'update_post_meta|add_post_meta|delete_post_meta|wp_update_post|\\$wpdb' integrations/woocommerce/pepew-payments; then
            echo "WooCommerce adapter must use WooCommerce order CRUD, not direct post/order storage writes."
            exit 1
          fi

  publish-pepewpay:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: devkit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download PepewPay static artifact
        uses: actions/download-artifact@v4
        with:
          name: pepewpay-dist
          path: ${{ runner.temp }}/pepewpay-dist

      - name: Publish static deployment branch
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pepewpay-dist
          git rm -rf .
          cp -a "${RUNNER_TEMP}/pepewpay-dist/." .
          printf 'source_commit=%s\nbuilt_by=GitHub Actions\n' "${SOURCE_COMMIT}" > DEPLOYMENT.txt
          touch .nojekyll
          git add -A
          git commit -m "deploy: PepewPay ${SOURCE_COMMIT}"
          git push --force origin HEAD:pepewpay-dist
