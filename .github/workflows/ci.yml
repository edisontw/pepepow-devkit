name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pepew-js dependencies
        run: npm install
        working-directory: packages/pepew-js

      - name: Test pepew-js
        run: npm test
        working-directory: packages/pepew-js

      - name: Install merchant SDK dependencies
        run: npm install
        working-directory: packages/pepewpay-merchant

      - name: Test merchant SDK
        run: npm test
        working-directory: packages/pepewpay-merchant

      - name: Check merchant reference examples
        run: node --check examples/merchant-node/reference-flow.mjs

      - name: Install PepewPay dependencies
        run: npm install
        working-directory: apps/pepewpay

      - name: Test PepewPay
        run: npm test
        working-directory: apps/pepewpay

      - name: Build PepewPay static output
        run: npm run build
        working-directory: apps/pepewpay

      - name: Check browser bundle for Node-only Buffer shims
        run: |
          set -euo pipefail
          if grep -R -n -E 'safe-buffer|process\.nextTick' dist/assets/*.js; then
            echo "PepewPay browser bundle contains Node-only compatibility code."
            exit 1
          fi
        working-directory: apps/pepewpay

      - name: Upload PepewPay static artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pepewpay-dist
          path: apps/pepewpay/dist
          if-no-files-found: error
          retention-days: 7

  merchant-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build local merchant SDK
        run: |
          npm install
          npm run build
        working-directory: packages/pepewpay-merchant

      - name: Install runnable merchant sample
        run: npm install
        working-directory: examples/merchant-app

      - name: Test runnable merchant sample
        run: npm run check
        working-directory: examples/merchant-app

      - name: Check framework webhook patterns
        run: |
          node --check examples/webhooks/express.mjs
          node --check examples/webhooks/fastify.mjs

      - name: Install Telegram adapter contract tests
        run: npm install --no-audit --no-fund
        working-directory: integrations/telegram

      - name: Test Telegram adapter contract
        run: npm test
        working-directory: integrations/telegram

  woocommerce-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Lint WooCommerce adapter PHP
        run: find integrations/woocommerce/pepew-payments -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test WooCommerce adapter units
        run: |
          php integrations/woocommerce/tests/identity-test.php
          php integrations/woocommerce/tests/webhook-verifier-test.php
          php integrations/woocommerce/tests/order-state-test.php

      - name: Check Checkout Blocks client script
        run: node --check integrations/woocommerce/pepew-payments/assets/js/blocks.js

      - name: Build WooCommerce plugin ZIP
        run: bash integrations/woocommerce/scripts/build-plugin.sh

      - name: Verify WooCommerce plugin ZIP
        run: bash integrations/woocommerce/scripts/verify-plugin-package.sh

      - name: Guard HPOS-safe order persistence
        run: |
          set -euo pipefail
          if grep -R -n -E 'update_post_meta|add_post_meta|delete_post_meta|wp_update_post|\\$wpdb' integrations/woocommerce/pepew-payments; then
            echo "WooCommerce adapter must use WooCommerce order CRUD, not direct post/order storage writes."
            exit 1
          fi

  woocommerce-runtime:
    name: WooCommerce runtime (${{ matrix.storage }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        storage:
          - legacy
          - hpos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install wp-env
        run: npm install --no-audit --no-fund
        working-directory: integrations/woocommerce

      - name: Start WordPress 7.1.2 / WooCommerce 11.1.2
        run: npx --no-install wp-env start
        working-directory: integrations/woocommerce

      - name: Configure order storage
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.storage }}" = "hpos" ]; then
            npx --no-install wp-env run cli wp wc hpos enable
          else
            npx --no-install wp-env run cli wp wc hpos disable
          fi
          npx --no-install wp-env run cli wp option update pepew_test_expected_hpos ${{ matrix.storage }}
          npx --no-install wp-env run cli wp wc hpos status
        working-directory: integrations/woocommerce

      - name: Run WooCommerce runtime smoke
        run: npx --no-install wp-env run cli wp eval-file wp-content/plugins/pepew-payments/wp-env/runtime-smoke.php
        working-directory: integrations/woocommerce

      - name: Run merchant lifecycle acceptance
        run: npx --no-install wp-env run cli wp eval-file wp-content/plugins/pepew-payments/wp-env/merchant-lifecycle-smoke.php
        working-directory: integrations/woocommerce

      - name: Show wp-env logs on failure
        if: failure()
        run: npx --no-install wp-env logs --watch=false
        working-directory: integrations/woocommerce

      - name: Stop wp-env
        if: always()
        run: npx --no-install wp-env stop
        working-directory: integrations/woocommerce

  woocommerce-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build and verify plugin ZIP
        run: |
          bash integrations/woocommerce/scripts/build-plugin.sh
          bash integrations/woocommerce/scripts/verify-plugin-package.sh

      - name: Install wp-env
        run: npm install --no-audit --no-fund
        working-directory: integrations/woocommerce

      - name: Select clean package environment
        run: cp .wp-env-package.json .wp-env.json
        working-directory: integrations/woocommerce

      - name: Start clean WordPress / WooCommerce runtime
        run: npx --no-install wp-env start
        working-directory: integrations/woocommerce

      - name: Copy built ZIP into WordPress shared volume
        shell: bash
        run: |
          set -euo pipefail
          wordpress_container=$(docker ps --filter 'name=wordpress' --format '{{.ID}}' | head -n 1)
          if [ -z "$wordpress_container" ]; then
            echo "wp-env WordPress container not found."
            exit 1
          fi
          docker cp dist/pepew-payments.zip "${wordpress_container}:/var/www/html/wp-content/uploads/pepew-payments.zip"
          npx --no-install wp-env run cli ls -l /var/www/html/wp-content/uploads/pepew-payments.zip
        working-directory: integrations/woocommerce

      - name: Install packaged plugin with WooCommerce active
        run: |
          npx --no-install wp-env run cli wp plugin install /var/www/html/wp-content/uploads/pepew-payments.zip --activate
          npx --no-install wp-env run cli wp plugin is-active pepew-payments
        working-directory: integrations/woocommerce

      - name: Verify overwrite upgrade preserves merchant settings
        run: |
          npx --no-install wp-env run cli wp eval 'update_option("woocommerce_pepew_settings", array("enabled" => "yes", "api_key" => "upgrade-secret", "webhook_secret" => "upgrade-webhook-secret"));'
          npx --no-install wp-env run cli wp plugin install /var/www/html/wp-content/uploads/pepew-payments.zip --force
          npx --no-install wp-env run cli wp plugin activate pepew-payments
          npx --no-install wp-env run cli wp plugin is-active pepew-payments
          npx --no-install wp-env run cli wp eval '$_s = get_option("woocommerce_pepew_settings", array()); exit((($_s["api_key"] ?? "") === "upgrade-secret" && ($_s["webhook_secret"] ?? "") === "upgrade-webhook-secret") ? 0 : 1);'
        working-directory: integrations/woocommerce

      - name: Reject activation while WooCommerce is inactive
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wp-env run cli wp plugin deactivate pepew-payments
          npx --no-install wp-env run cli wp plugin deactivate woocommerce
          set +e
          npx --no-install wp-env run cli wp plugin activate pepew-payments
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "PEPEW plugin activated even though required WooCommerce dependency was inactive."
            exit 1
          fi
          if npx --no-install wp-env run cli wp plugin is-active pepew-payments; then
            echo "PEPEW plugin unexpectedly remained active without WooCommerce."
            exit 1
          fi
          npx --no-install wp-env run cli wp plugin activate woocommerce
          npx --no-install wp-env run cli wp plugin activate pepew-payments
        working-directory: integrations/woocommerce

      - name: Verify uninstall removes merchant secrets but not by deactivation
        run: |
          npx --no-install wp-env run cli wp plugin deactivate pepew-payments
          npx --no-install wp-env run cli wp eval 'exit(false !== get_option("woocommerce_pepew_settings", false) ? 0 : 1);'
          npx --no-install wp-env run cli wp plugin activate pepew-payments
          npx --no-install wp-env run cli wp plugin uninstall pepew-payments --deactivate
          npx --no-install wp-env run cli wp eval 'exit(false === get_option("woocommerce_pepew_settings", false) ? 0 : 1);'
        working-directory: integrations/woocommerce

      - name: Reject activation when WooCommerce plugin files are absent
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wp-env run cli wp plugin install /var/www/html/wp-content/uploads/pepew-payments.zip
          npx --no-install wp-env run cli wp plugin deactivate woocommerce
          npx --no-install wp-env run cli mv wp-content/plugins/woocommerce/woocommerce.php wp-content/plugins/woocommerce/woocommerce.php.disabled
          set +e
          npx --no-install wp-env run cli wp plugin activate pepew-payments
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "PEPEW plugin activated even though WooCommerce plugin files were absent."
            exit 1
          fi
        working-directory: integrations/woocommerce

      - name: Upload WooCommerce plugin artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: pepew-payments-woocommerce
          path: |
            integrations/woocommerce/dist/pepew-payments.zip
            integrations/woocommerce/dist/pepew-payments.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Show wp-env logs on failure
        if: failure()
        run: npx --no-install wp-env logs --watch=false
        working-directory: integrations/woocommerce

      - name: Stop wp-env
        if: always()
        run: npx --no-install wp-env stop
        working-directory: integrations/woocommerce

  publish-pepewpay:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: devkit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download PepewPay static artifact
        uses: actions/download-artifact@v4
        with:
          name: pepewpay-dist
          path: ${{ runner.temp }}/pepewpay-dist

      - name: Publish static deployment branch
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pepewpay-dist
          git rm -rf .
          cp -a "${RUNNER_TEMP}/pepewpay-dist/." .
          printf 'source_commit=%s\nbuilt_by=GitHub Actions\n' "${SOURCE_COMMIT}" > DEPLOYMENT.txt
          touch .nojekyll
          git add -A
          git commit -m "deploy: PepewPay ${SOURCE_COMMIT}"
          git push --force origin HEAD:pepewpay-dist
