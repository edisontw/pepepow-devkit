name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pepew-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pepew-js dependencies
        run: npm install
        working-directory: packages/pepew-js

      - name: Build and test pepew-js
        run: npm test
        working-directory: packages/pepew-js
