name: Community Bots CI

on:
  push:
    paths:
      - "community-bots/**"
      - ".github/workflows/community-bots.yml"
  pull_request:
    paths:
      - "community-bots/**"
      - ".github/workflows/community-bots.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-bots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: pytest -q
